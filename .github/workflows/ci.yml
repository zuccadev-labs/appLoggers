name: CI

on:
  pull_request:
    branches: [ main, dev ]
  push:
    branches: [ main, dev ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

defaults:
  run:
    working-directory: sdk

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Override local JDK path for CI
        run: sed -i '/org.gradle.java.home/d' gradle.properties

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run Detekt
        run: ./gradlew detekt

      - name: Upload Detekt Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-reports
          path: sdk/build/reports/detekt/
          retention-days: 14

  test:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Override local JDK path for CI
        run: sed -i '/org.gradle.java.home/d' gradle.properties

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run Unit Tests
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: ./gradlew :logger-core:jvmTest :logger-test:jvmTest :logger-transport-supabase:jvmTest

      - name: Generate Coverage Report
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: ./gradlew jacocoTestReport

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: 'sdk/**/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml'
          flags: unittests
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            sdk/**/build/reports/tests/
            sdk/**/build/test-results/
            sdk/**/build/reports/jacoco/
          retention-days: 14

      - name: Build
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: ./gradlew assemble

  e2e:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: apploggers

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Override local JDK path for CI
        run: sed -i '/org.gradle.java.home/d' gradle.properties

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Capture integrity verify window start
        shell: bash
        run: echo "VERIFY_FROM=$(date -u -d '5 minutes ago' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Run E2E Tests against Supabase
        env:
          appLogger_supabaseUrl: ${{ secrets.APPLOGGER_SUPABASE_URL || secrets.APPLOGGER_URL }}
          APPLOGGER_SUPABASE_URL: ${{ secrets.APPLOGGER_SUPABASE_URL || secrets.APPLOGGER_URL }}
          APPLOGGER_SUPABASE_ANON_KEY: ${{ secrets.APPLOGGER_SUPABASE_ANON_KEY || secrets.APPLOGGER_ANON_KEY }}
          APPLOGGER_SUPABASE_SERVICE_KEY: ${{ secrets.APPLOGGER_SUPABASE_SERVICE_KEY }}
          APPLOGGERS_INTEGRITY_SECRET: ${{ secrets.APPLOGGERS_INTEGRITY_SECRET }}
          APPLOGGERS_INTEGRITY_SECRET_ID: ${{ secrets.APPLOGGERS_INTEGRITY_SECRET_ID }}
        run: ./gradlew :logger-transport-supabase:jvmTest

      - name: Set up Go for integrity verify
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
          cache-dependency-path: cli/go.sum

      - name: Build CLI config for integrity verify
        shell: bash
        env:
          APPLOGGER_SUPABASE_URL: ${{ secrets.APPLOGGER_SUPABASE_URL || secrets.APPLOGGER_URL }}
          APPLOGGER_SUPABASE_SERVICE_KEY: ${{ secrets.APPLOGGER_SUPABASE_SERVICE_KEY }}
          APPLOGGERS_INTEGRITY_SECRET: ${{ secrets.APPLOGGERS_INTEGRITY_SECRET }}
          APPLOGGERS_INTEGRITY_SECRET_ID: ${{ secrets.APPLOGGERS_INTEGRITY_SECRET_ID }}
        run: |
          jq -n \
            --arg url "$APPLOGGER_SUPABASE_URL" \
            --arg apiKey "$APPLOGGER_SUPABASE_SERVICE_KEY" \
            --arg integritySecret "$APPLOGGERS_INTEGRITY_SECRET" \
            --arg integritySecretId "$APPLOGGERS_INTEGRITY_SECRET_ID" \
            '{
              default_project: "CI-E2E",
              projects: [
                {
                  name: "CI-E2E",
                  supabase: {
                    url: $url,
                    api_key: $apiKey,
                    schema: "apploggers",
                    logs_table: "app_logs",
                    metrics_table: "app_metrics",
                    timeout_seconds: 15,
                    integrity_secret: $integritySecret,
                    integrity_secret_id: $integritySecretId,
                    integrity_secrets: {
                      ($integritySecretId): $integritySecret
                    }
                  }
                }
              ]
            }' > "$RUNNER_TEMP/apploggers-cli.json"

      - name: Verify batch integrity (gate)
        shell: bash
        working-directory: cli
        run: |
          VERIFY_TO="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p ../artifacts/evidence
          go run ./cmd/applogger-cli \
            --config "$RUNNER_TEMP/apploggers-cli.json" \
            --project CI-E2E \
            verify --signal both --from "$VERIFY_FROM" --to "$VERIFY_TO" --output json \
            | tee ../artifacts/evidence/verify-ci-e2e.json
          jq -e '.ok == true' ../artifacts/evidence/verify-ci-e2e.json > /dev/null

      - name: Upload Integrity Verify Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrity-verify-evidence
          path: artifacts/evidence/verify-ci-e2e.json
          retention-days: 14

      - name: Upload E2E Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: |
            sdk/**/build/reports/tests/
            sdk/**/build/test-results/
          retention-days: 14

  security:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Override local JDK path for CI
        run: sed -i '/org.gradle.java.home/d' gradle.properties

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build for CodeQL
        run: ./gradlew :logger-core:compileKotlinJvm :logger-transport-supabase:compileKotlinJvm
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin

      - name: Dependency Submission
        continue-on-error: true
        uses: mikepenz/gradle-dependency-submission@v1
        with:
          gradle-project-path: sdk
          gradle-build-module: ':logger-core'
          gradle-build-configuration: 'jvmCompileClasspath'
